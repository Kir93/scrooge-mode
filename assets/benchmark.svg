<svg viewBox="0 0 760 276" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Scrooge median output tokens vs baselines</title>
<desc id="dsc">Korean N=20: normal 3186, terse 2597, caveman 1203, scrooge 972 (-70%). English N=21: normal 3578, terse 2509, caveman 1264, scrooge 969 (-73%). claude-opus-4-8, paired median.</desc>
<style>@media (prefers-color-scheme:dark){.t{fill:#e6edf3}.m{fill:#8b949e}.card{fill:#0d1117;stroke:#30363d}.grid{stroke:#21262d}.bar{fill:#454d59}.hi{fill:#2ea043}}</style>
