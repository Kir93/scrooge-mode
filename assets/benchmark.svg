<text class="t" x="188" y="142" fill="#1f2937" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">844</text>
<text class="hi" x="222" y="142" fill="#1f9d57" font-weight="600">−60%</text>
<text class="m" x="28" y="180" fill="#6b7280" font-size="11">per-prompt median −63.7% · 95% CI 56.1–66.6%</text>
<text class="m" x="28" y="198" fill="#6b7280" font-size="11">smaller on 19/19 prompts</text>

<text class="t" x="396" y="66" fill="#1f2937" font-size="15" font-weight="500">English</text>
<text class="hi" x="732" y="66" fill="#1f9d57" font-size="14" font-weight="600" text-anchor="end">−55% vs normal</text>
<text class="m" x="396" y="84" fill="#6b7280" font-size="11">N = 19</text>

<text class="t" x="396" y="108" fill="#1f2937">normal</text>
<rect class="base" x="478" y="96" width="127" height="16" rx="3" fill="#e15c4a"/>
