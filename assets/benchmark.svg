<svg viewBox="0 0 760 276" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Scrooge median output tokens vs normal baseline</title>
<desc id="dsc">claude-opus-5-5, held-out corpus, register v0.27.0, paired median. Korean N=19: normal 2097, scrooge 844 (-60%); per-prompt median 63.7% (95% CI 56.1-66.6%), smaller on 19/19. English N=19: normal 1476, scrooge 665 (-55%); per-prompt median 59.8% (95% CI 50.2-63.0%), smaller on 19/19.</desc>
<style>@media (prefers-color-scheme:dark){.t{fill:#e6edf3}.m{fill:#8b949e}.card{fill:#0d1117;stroke:#30363d}.grid{stroke:#21262d}.bar{fill:#454d59}.hi{fill:#2ea043}}</style>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12">
<rect class="card" x="1" y="1" width="758" height="274" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
<text class="m" x="28" y="30" fill="#6b7280" font-size="12">Median output tokens per turn · claude-opus-5-5 · held-out corpus · paired median</text>
<line class="grid" x1="28" y1="42" x2="732" y2="42" stroke="#e9ecef"/>

