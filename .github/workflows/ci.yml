name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    # Both ends of the supported range. 18 is what `engines` declares, so it is the
    # version a user on the floor actually runs; 22 is the release/dev version. A
    # post-18 API slipping into the code is otherwise invisible until someone on
    # the declared minimum hits it. If 18 goes red, the fix is to raise `engines`
    # to the real minimum — not to keep the code artificially old.
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      # The benchmark harness is Python and is otherwise unguarded. Only the
      # statistics helpers are covered — they decide whether a published CI can be
      # re-derived from a committed JSONL, so a silent change to them would
      # invalidate the numbers in README.md without moving any JS test.
      - name: Test benchmark statistics
        run: python3 -m unittest discover -s benchmarks -p 'test_*.py'

      - name: Markdown lint
        run: npx --yes markdownlint-cli2@0.22.1 "**/*.md"

      # registry 경로/도달성 검증은 `npm test`의 tests/test_registry_parity.js가 단일 정본으로
      # 수행한다 (integrity-sweep Task 1). 여기에 사본을 다시 만들지 말 것.

      - name: Verify package file list
        run: node .github/scripts/verify-pack.mjs

      - name: Verify JSON files
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const files = [
            'package.json',
            'registry.json',
            '.claude-plugin/marketplace.json',
            '.claude-plugin/plugin.json',
          ];

          for (const file of files) {
            try {
              JSON.parse(readFileSync(file, 'utf8'));
            } catch (error) {
              console.error(`${file}: ${error.message}`);
              process.exitCode = 1;
            }
          }
          NODE

      # Non-blocking advisory: a change to rules/** (register rule bodies and fragments,
      # all under rules/) gets a "재측정 필요" marker so the maintainer re-runs the manual
      # fidelity judge gate (RELEASE.md § "Fidelity judge gate") before release. Fires on
      # BOTH a rules-touching PR and a direct push to main — the latter is the maintainer's
      # own /my-release path, where no PR review would otherwise surface the change. The
      # deterministic golden-corpus check (npm test) is blind to rule-text edits (frozen
      # corpus, F1), so this marker + the manual judge are the rule-regression signal. Pure
      # git diff — no subscription CLI. continue-on-error + base-ref skip keep it strictly
      # non-blocking (fork/shallow clone or a first/force push without the base commit are
      # skipped). Base per event: PR → the PR base sha; push → the pre-push sha (before).
      - name: Flag rule changes for judge re-measurement
        continue-on-error: true
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          # Empty or all-zero base (first push, new branch, or a force-push with no
          # recorded parent) — nothing to diff against; skip (non-blocking).
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "::notice title=재측정 마커 스킵::base ref 없음(최초/force push) — rule-diff 판정 생략 (비차단)"
            exit 0
          fi
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE" 2>/dev/null || true
          fi
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "::notice title=재측정 마커 스킵::base ref 미획득(fork/shallow clone) — rule-diff 판정 생략 (비차단)"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE" HEAD -- 'rules/' || true)
          if [ -n "$CHANGED" ]; then
            echo "::warning title=register 재측정 필요::rules/ 변경 감지 — 실질 변경이면 릴리스 전 RELEASE.md의 Fidelity judge gate(수동 judge N=3)를 확인하세요 (비차단)"
            {
              echo "### ⚠️ register 재측정 필요"
              echo ""
              echo "이 변경은 \`rules/**\`를 건드립니다. **실질 변경**(지시문 add/remove/의미변경·dial 톤·safety/boundary 절)이면 릴리스 전 RELEASE.md의 **Fidelity judge gate**(수동 LLM judge, N=3)를 실행하세요. typo·주석·markdownlint 수정은 면제입니다. 비차단 안내이며 머지/릴리스를 막지 않습니다."
              echo ""
              echo "변경된 rule 파일:"
              echo '```'
              echo "$CHANGED"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "rules/ 무변경 — 재측정 마커 미노출"
          fi
