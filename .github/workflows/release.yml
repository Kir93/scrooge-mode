name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag, for example v0.2.1
        required: true

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify version triple
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const input = process.env.RELEASE_VERSION;
          if (!/^v\d+\.\d+\.\d+$/.test(input)) {
            console.error(`version must match vX.Y.Z, got: ${input}`);
            process.exit(1);
          }

          const expected = input.slice(1);
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const marketplace = JSON.parse(readFileSync('.claude-plugin/marketplace.json', 'utf8'));
          const actual = {
            'package.json version': pkg.version,
            'marketplace metadata.version': marketplace.metadata?.version,
            'marketplace plugins[0].version': marketplace.plugins?.[0]?.version,
          };

          const mismatches = Object.entries(actual)
            .filter(([, value]) => value !== expected)
            .map(([field, value]) => `${field}: expected ${expected}, got ${value}`);

          if (mismatches.length > 0) {
            console.error(mismatches.join('\n'));
            process.exit(1);
          }
          NODE

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Tag release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: git tag "$RELEASE_VERSION"

      - name: Push tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: git push origin "$RELEASE_VERSION"
